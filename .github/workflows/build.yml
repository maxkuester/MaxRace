# Builds the MaxRace installers on GitHub's own Windows and Mac machines.
# Runs on every push to main, from the Actions tab ("Run workflow"), or on a tag like v1.0.0.
# The installers appear at the bottom of the run page, under "Artifacts".
name: Build MaxRace

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: MaxRace-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
      # fixed public download links:
      #   https://github.com/<owner>/<repo>/releases/latest/download/MaxRace-Setup.exe
      #   https://github.com/<owner>/<repo>/releases/latest/download/MaxRace.dmg
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: MaxRace (latest build)
          make_latest: "true"
          body: "Windows: download MaxRace-Setup.exe and double-click it. Mac: download MaxRace.dmg, open it and drag MaxRace to Applications."
          files: |
            dist/MaxRace-Setup.exe
            dist/MaxRace.dmg
