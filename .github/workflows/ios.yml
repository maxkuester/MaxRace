# Builds MaxRace for iPhone and iPad on GitHub's Mac machines.
#
# Always: an unsigned build, MaxRace-iOS-unsigned.ipa, attached to the "latest" release.
#   It can be installed with a free Apple ID through Sideloadly or AltStore (it then runs for 7 days).
#
# With an Apple Developer account: add these repository secrets and every push also goes to TestFlight.
#   APPLE_TEAM_ID          10-character Team ID (developer.apple.com › Membership)
#   ASC_KEY_ID             App Store Connect API key ID     (App Store Connect › Users and Access › Integrations › Keys,
#   ASC_ISSUER_ID          issuer ID shown on the same page   role "Admin" so Xcode can make the certificates)
#   ASC_KEY_P8             the whole text of the downloaded AuthKey_XXXX.p8 file
# and optionally the repository variable IOS_BUNDLE_ID (default com.maxrace.dash), the same id as the app
# created in App Store Connect › Apps.
name: Build MaxRace iOS

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    env:
      MAXRACE_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.maxrace.dash' }}
      MAXRACE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Page and offline fonts into the app
        run: |
          node scripts/fetch-fonts.js
          mkdir -p ios/web
          cp maxrace.html ios/web/maxrace.html
          if [ -d fonts ]; then cp -R fonts ios/web/fonts; fi

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Unsigned build
        run: |
          cd ios
          xcodebuild -project MaxRace.xcodeproj -scheme MaxRace -configuration Release -sdk iphoneos \
            -derivedDataPath build CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40
          test -d build/Build/Products/Release-iphoneos/MaxRace.app
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/MaxRace.app Payload/
          zip -qry MaxRace-iOS-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MaxRace-iOS-unsigned
          path: ios/MaxRace-iOS-unsigned.ipa

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MaxRace (latest build)
          files: ios/MaxRace-iOS-unsigned.ipa

      - name: TestFlight
        if: ${{ env.ASC_KEY_ID != '' && env.MAXRACE_TEAM_ID != '' }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          cd ios
          sed "s/TEAM_ID_PLACEHOLDER/$MAXRACE_TEAM_ID/" ExportOptions.plist > build/ExportOptions.plist
          xcodebuild -project MaxRace.xcodeproj -scheme MaxRace -configuration Release -sdk iphoneos \
            -archivePath build/MaxRace.xcarchive CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            DEVELOPMENT_TEAM=$MAXRACE_TEAM_ID $AUTH archive | tail -40
          xcodebuild -exportArchive -archivePath build/MaxRace.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export $AUTH | tail -40
