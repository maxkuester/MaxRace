# Builds the Capacitor app (native/) for Android and iPhone/iPad on GitHub's machines.
#   Android: MaxRace-Android-debug.apk, installs directly on the phone (allow "install unknown apps").
#   iOS:     MaxRace-iOS-cap-unsigned.ipa, installs with a free Apple ID through Sideloadly or AltStore.
# Both appear at the bottom of the run page, under "Artifacts". Nothing is published to the releases yet:
# the earlier iOS app (ios/, workflow ios.yml) stays the released one until this one is tested on the water.
name: Build MaxRace mobile

on:
  workflow_dispatch:
  push:
    branches: [main, "feat/capacitor-*"]

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"     # the desktop program is not built here

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Page, fonts and plugins into the Android project
        run: |
          node scripts/fetch-fonts.js
          node scripts/fetch-vendor.js
          node scripts/build-native-web.js
          npx cap sync android
      - name: Build the APK
        run: |
          cd native/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../MaxRace-Android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MaxRace-Android
          path: MaxRace-Android-debug.apk
          if-no-files-found: error

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - name: Page, fonts and plugins into the iOS project
        run: |
          node scripts/fetch-fonts.js
          node scripts/fetch-vendor.js
          node scripts/build-native-web.js
          npx cap sync ios
      - name: Unsigned build
        run: |
          cd native/ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -60
          test -d build/Build/Products/Release-iphoneos/App.app
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry ../../../MaxRace-iOS-cap-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MaxRace-iOS-cap
          path: MaxRace-iOS-cap-unsigned.ipa
          if-no-files-found: error
